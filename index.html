  <!-- set theme before paint to avoid flash -->
  <script>
    (function () { try { var t = JSON.parse(localStorage.getItem('gfit:theme')); if (t) document.documentElement.setAttribute('data-theme', t); else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {} })();
  </script>
